# graph-node and its dependencies, for indexing the local dev chain.
#
# Start with `pnpm externals`, tear down with `pnpm externals:down`. The
# subgraph is deployed into it by `pnpm subgraph:deploy:local:watch`.
#
# The network is called `localhost`, which must match the name generate.cjs
# derives for chain 31337; a mismatch shows up as a subgraph that deploys and
# then indexes nothing.
#
# It points at port 8546, the hardhat node itself, NOT 8545 where purgatory sits
# in front of it. Purgatory deliberately delays inclusion so the app can be
# tested against realistic confirmation behaviour, which is not something an
# indexer should be looking at.
services:
  graph-node:
    image: graphprotocol/graph-node
    ports:
      - '8000:8000'
      - '8001:8001'
      - '8020:8020'
      - '8030:8030'
      - '8040:8040'
    depends_on:
      - ipfs
      - postgres
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: 'ipfs:5001'
      ethereum: 'localhost:http://host.docker.internal:8546'
      GRAPH_LOG: info

  ipfs:
    image: ipfs/kubo:v0.17.0
    ports:
      - '5001:5001'
    volumes:
      - ipfs-data:/data/ipfs
    command:
      ['--offline', 'daemon', '--migrate=true', '--agent-version-suffix=docker']

  postgres:
    image: postgres:14
    ports:
      - '5432:5432'
    command:
      [
        'postgres',
        '-cshared_preload_libraries=pg_stat_statements',
        '-cmax_connections=200',
      ]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      PGDATA: '/var/lib/postgresql/data'
      POSTGRES_INITDB_ARGS: '-E UTF8 --locale=C'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  ipfs-data:
  postgres-data:

# graph-node and its dependencies, for indexing the local dev chain.
#
# Start with `pnpm externals`, tear down with `pnpm externals:down`. The
# subgraph is deployed into it by `pnpm subgraph:deploy:local:watch`.
#
# `pnpm externals` WIPES the volumes before starting, on purpose. The dev chain
# is ephemeral: `hardhat node` starts from genesis every time, so block 134 of
# this run is a different block from block 134 of the last one. graph-node
# persists what it indexed in postgres, sees a different hash at a height it has
# already written, and treats it as a reorg. It then tries to revert past its own
# earliest block, fails with `store error: No rows affected`, and retries
# forever:
#
#   ERRO Could not revert block. Retrying, error: store error: No rows affected.
#   ERRO Subgraph writer failed ... attempt to revert beyond earliest_block
#
# An indexer of a throwaway chain has to be as throwaway as the chain.
#
# The network is called `localhost`, which must match the name generate.cjs
# derives for chain 31337; a mismatch shows up as a subgraph that deploys and
# then indexes nothing.
#
# It points at port 8546, the hardhat node itself, NOT 8545 where purgatory sits
# in front of it. Purgatory deliberately delays inclusion so the app can be
# tested against realistic confirmation behaviour, which is not something an
# indexer should be looking at.
#
# graph-node runs on the HOST network, and reaches everything over 127.0.0.1.
# `host.docker.internal` does not work under rootless Docker: the container is in
# its own network namespace with its own (disabled) ip_forward, so the host's
# sysctl is irrelevant and every route to the host is refused. Host networking is
# the one thing that works in both rootless and rootful setups, and it also means
# the dev chain does not have to be moved into the compose file. ipfs and postgres
# stay in the compose network and are reached through their published ports.
services:
  graph-node:
    image: graphprotocol/graph-node
    network_mode: host
    depends_on:
      - ipfs
      - postgres
    environment:
      postgres_host: 127.0.0.1
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: '127.0.0.1:5001'
      ethereum: 'localhost:http://127.0.0.1:8546'
      GRAPH_LOG: info

  ipfs:
    image: ipfs/kubo:v0.17.0
    ports:
      - '5001:5001'
    volumes:
      - ipfs-data:/data/ipfs
    command:
      ['--offline', 'daemon', '--migrate=true', '--agent-version-suffix=docker']

  postgres:
    image: postgres:14
    ports:
      - '5432:5432'
    command:
      [
        'postgres',
        '-cshared_preload_libraries=pg_stat_statements',
        '-cmax_connections=200',
      ]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      PGDATA: '/var/lib/postgresql/data'
      POSTGRES_INITDB_ARGS: '-E UTF8 --locale=C'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  ipfs-data:
  postgres-data:
